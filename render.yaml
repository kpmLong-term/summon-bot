# Web service so Render injects PORT and RENDER_EXTERNAL_URL.
# The bot binds that port (/health, /ping) and pings itself to stay awake.
services:
  - type: web
    name: summon-bot
    runtime: python
    plan: free
    buildCommand: pip install -U pip && pip install -r requirements.txt
    startCommand: python -m summon_bot
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: LOG_CHANNEL_ID
        sync: false
      - key: DATABASE_URL
        sync: false
